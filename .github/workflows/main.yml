name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Insert last updated date
        run: |
          mkdir _site
          d=$(git log -1 --format=%cd --date=format:'%-d %B %Y' -- index.html)
          sed "s|{{LAST_UPDATED}}|$d|" index.html > _site/index.html
      - uses: actions/upload-pages-artifact@v5
      - id: deployment
        uses: actions/deploy-pages@v5
